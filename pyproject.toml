[project]
name = "tractatus"
version = "0.1.0"
description = "Tractatus Research — data access, calculations, and utilities for trading research"
readme = "README.md"
authors = [
    { name = "Joseph Platta", email = "jwplatta@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.1",
    "pyiceberg[glue,s3fs]>=0.7",
    "scipy>=1.13",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyiceberg.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "boto3-stubs[s3]>=1.34",
    "pandas-stubs>=3.0.0",
]

[project.scripts]
tractatus = "tractatus.cli:app"
